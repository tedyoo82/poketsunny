<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포케써니 | Pokémon GO 뉴스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=11" />
  <style>
    /* ===== 뉴스 상세 페이지 ===== */
    .detail-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }
    .detail-page__back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--cyan);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .detail-page__back:hover { color: var(--violet); }
    .detail-page__meta {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--ink-dim);
      font-size: 0.8rem;
      margin-bottom: 16px;
      font-family: var(--font-en);
    }
    .detail-page__title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.4;
      margin: 0 0 24px;
    }
    .detail-page__image {
      width: 100%;
      border-radius: var(--radius);
      margin-bottom: 24px;
      overflow: hidden;
    }
    .detail-page__image img {
      width: 100%;
      height: auto;
      display: block;
    }
    .detail-page__summary {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--ink-soft);
      margin-bottom: 24px;
      padding: 16px 20px;
      background: rgba(139, 123, 255, 0.05);
      border: 1px solid rgba(139, 123, 255, 0.15);
      border-radius: var(--radius);
    }
    .detail-page__body {
      font-size: 0.95rem;
      line-height: 1.85;
      color: var(--ink);
      white-space: pre-wrap;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
    }
    .detail-page__loading,
    .detail-page__error {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-dim);
    }
    .detail-page__error { color: #e74c3c; }
    @media (max-width: 600px) {
      .detail-page { padding: 24px 16px 60px; }
      .detail-page__title { font-size: 1.25rem; }
      .detail-page__summary,
      .detail-page__body { padding: 16px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-header__logo">포케써니</a>
      <nav class="site-header__nav">
        <a href="index.html">홈</a>
        <a href="index.html#news">뉴스</a>
      </nav>
    </div>
  </header>

  <main class="detail-page" id="detail-page">
    <div class="detail-page__loading">로딩 중...</div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 포케써니 | Pokémon GO YouTube 채널</p>
    </div>
  </footer>

  <script>
    (function () {
      "use strict";

      // URL 파라미터에서 뉴스 URL 추출
      var params = new URLSearchParams(window.location.search);
      var newsUrl = params.get("url");

      var container = document.getElementById("detail-page");

      if (!newsUrl) {
        container.innerHTML = '<div class="detail-page__error">뉴스 URL이 없습니다.<br><a href="index.html#news" class="detail-page__back">← 뉴스 목록으로</a></div>';
        return;
      }

      // news.json에서 해당 뉴스 찾기
      fetch("news.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(function (news) {
          var item = null;
          for (var i = 0; i < news.length; i++) {
            if (news[i].url === newsUrl) {
              item = news[i];
              break;
            }
          }
          if (!item) {
            container.innerHTML = '<div class="detail-page__error">뉴스를 찾을 수 없습니다.<br><a href="index.html#news" class="detail-page__back">← 뉴스 목록으로</a></div>';
            return;
          }
          renderDetail(item);
        })
        .catch(function (err) {
          console.warn("[pokesunny] news.json fetch failed:", err);
          container.innerHTML = '<div class="detail-page__error">데이터를 불러오지 못했습니다.<br><a href="index.html#news" class="detail-page__back">← 뉴스 목록으로</a></div>';
        });

      function escapeHtml(str) {
        var div = document.createElement("div");
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      function renderDetail(n) {
        var pubDate = n.published ? new Date(n.published).toLocaleDateString("ko-KR") : "";

        var html = '';

        // 뒤로가기
        html += '<a href="index.html#news" class="detail-page__back">← 뉴스 목록</a>';

        // 메타
        html += '<div class="detail-page__meta">';
        if (pubDate) html += '<span>' + pubDate + '</span>';
        html += '</div>';

        // 제목
        html += '<h1 class="detail-page__title">' + escapeHtml(n.title || "") + '</h1>';

        // 이미지
        if (n.image) {
          html += '<div class="detail-page__image">';
          html += '<img src="' + escapeHtml(n.image) + '" alt="" loading="eager" />';
          html += '</div>';
        }

        // 요약
        if (n.summary) {
          html += '<div class="detail-page__summary">' + escapeHtml(n.summary) + '</div>';
        }

        // 본문
        if (n.content) {
          html += '<div class="detail-page__body">' + escapeHtml(n.content) + '</div>';
        }

        container.innerHTML = html;
      }
    })();
  </script>
</body>
</html>
