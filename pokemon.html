<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <meta property="og:description" content="포켓몬GO 전 9개 지역 1,024마리 포켓몬 타입, 스펙, 스킬, 진화 정보" />
  <meta property="og:url" content="https://pokesunny.com/pokemon.html" />
  <meta property="og:image" content="https://i.ytimg.com/vi/VkNF1t4fHZw/maxresdefault.jpg" />
  <meta property="og:locale" content="ko_KR" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="포케써니 | 포켓몬 사전" />
  <meta name="twitter:description" content="포켓몬GO 전 9개 지역 1,024마리 포켓몬 정보" />
  <meta name="twitter:image" content="https://i.ytimg.com/vi/VkNF1t4fHZw/maxresdefault.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=12" />
</head>
<body>
  <!-- ===== 배경 장식 ===== -->
  <div class="bg" aria-hidden="true">
    <div class="bg__glow bg__glow--top"></div>
    <div class="bg__glow bg__glow--bottom"></div>
    <div class="stars"></div>
  </div>

  <!-- ===== 헤더 ===== -->
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="index.html">
        <span class="brand__ball" aria-hidden="true"></span>
        <span class="brand__name">포케써니</span>
      </a>

      <nav class="nav" aria-label="주요 메뉴">
        <a href="index.html#news">뉴스</a>
        <a href="index.html#events">이벤트</a>
        <a href="index.html#about">소개</a>
        <a href="index.html#content">콘텐츠</a>
        <a href="index.html#messages">게시판</a>
        <a href="index.html#subscribe">구독</a>
      </nav>

      <a class="btn btn--sm btn--ghost" href="https://www.youtube.com/@Poke_Sunny" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.5 15.5v-7l6.5 3.5-6.5 3.5Z"/></svg>
        유튜브
      </a>
    </div>
  </header>

  <main id="top">
    <!-- ===== 히어로 ===== -->
    <section class="hero hero--pokemon">
      <div class="hero__badge">
        <span class="dot" aria-hidden="true"></span> Pokémon GO Pokédex
      </div>

      <h1 class="hero__title">
        포켓몬<br />
        <span class="grad">사전</span>
      </h1>

      <p class="hero__lead">
        전 9개 지역, 1,024마리 포켓몬의 타입·스펙·스킬·진화 정보를 한눈에
      </p>

      <!-- 검색 & 필터 -->
      <div class="poke-controls">
        <div class="poke-search">
          <svg viewBox="0 0 24 24" class="ic poke-search__ic" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="poke-search" placeholder="포켓몬 이름 검색..." autocomplete="off" />
        </div>

        <div class="poke-types" id="poke-types">
          <!-- 타입 버튼 JS로 렌더링 -->
        </div>
      </div>
    </section>

    <!-- ===== 지역 탭 ===== -->
    <section class="section section--pokemon">
      <div class="poke-tabs" id="poke-tabs">
        <!-- 탭 버튼 JS로 렌더링 -->
      </div>

      <!-- 통계 바 -->
      <div class="poke-stats-bar" id="poke-stats-bar">
        <span class="poke-stats-bar__label">전체 <strong id="poke-total">0</strong>마리</span>
        <span class="poke-stats-bar__label">표시 <strong id="poke-visible">0</strong>마리</span>
      </div>

      <!-- 포켓몬 그리드 -->
      <div class="poke-grid" id="poke-grid">
        <div class="poke-grid__loading">불러오는 중…</div>
      </div>

      <!-- 로딩 & 무한 스크롤 -->
      <div class="poke-load-more" id="poke-load-more">
        <button type="button" class="btn btn--ghost">
          더 보기
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
        </button>
      </div>

      <!-- 로딩 인디케이터 -->
      <div class="poke-loading-indicator" id="poke-loading-indicator" style="display:none">
        <div class="poke-spinner"></div>
        <span>불러오는 중…</span>
      </div>

      <!-- 결과 없음 -->
      <div class="poke-empty" id="poke-empty" style="display:none">
        <div class="poke-empty__icon">🔍</div>
        <p>검색 결과가 없습니다.</p>
      </div>
    </section>
  </main>

  <!-- ===== 푸터 ===== -->
  <footer class="footer">
    <div class="footer__inner">
      <a class="brand brand--footer" href="index.html">
        <span class="brand__ball" aria-hidden="true"></span>
        <span class="brand__name">포케써니</span>
      </a>
      <p class="footer__note">포켓몬GO 레이드 공략 &amp; 게임 정보 · 잠들기 전 듣는 포켓몬 이야기</p>
      <a class="footer__yt" href="https://www.youtube.com/@Poke_Sunny" target="_blank" rel="noopener">
        @Poke_Sunny
      </a>
      <p class="footer__copy">© 2026 포케써니 · Pokémon GO 데이터 제공: <a href="https://pokemon-go-api.github.io" target="_blank" rel="noopener" class="footer__link">Pokémon GO API</a></p>
    </div>
  </footer>

  <!-- ===== 포켓몬 상세 모달 ===== -->
  <div class="poke-modal" id="poke-modal" style="display:none">
    <div class="poke-modal__backdrop" id="poke-modal-backdrop"></div>
    <div class="poke-modal__content">
      <button class="poke-modal__close" id="poke-modal-close" aria-label="닫기">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <div class="poke-modal__body" id="poke-modal-body">
        <!-- JS로 렌더링 -->
      </div>
    </div>
  </div>

  <script src="pokemon.js?v=12"></script>
</body>
</html>
