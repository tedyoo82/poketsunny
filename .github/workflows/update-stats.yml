name: Update YouTube Stats

# 15분마다 자동 실행
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch channel stats & recent videos & news
        run: |
          echo "=== Before fetch ===" >&2
          cat stats.json 2>/dev/null || echo "stats.json not found" >&2
          cat recent_videos.json 2>/dev/null || echo "recent_videos.json not found" >&2
          echo "" >&2

          python3 fetch_stats.py || echo "ERROR: fetch_stats.py failed" >&2
          python3 fetch_videos.py || echo "ERROR: fetch_videos.py failed" >&2
          python3 fetch_news.py || echo "ERROR: fetch_news.py failed" >&2

          echo "=== After fetch ===" >&2
          cat stats.json 2>/dev/null || echo "stats.json not found" >&2
          cat recent_videos.json 2>/dev/null || echo "recent_videos.json not found" >&2

      - name: Commit & push stats.json, recent_videos.json & news.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json recent_videos.json news.json _headers
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update YouTube stats, videos & news ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push "https://${GITHUB_TOKEN}@github.com/tedyoo82/poketsunny.git" HEAD:main
          fi
