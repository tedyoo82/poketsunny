name: Update YouTube Stats

# 매일 09:00 UTC (한국 18:00) 자동 실행
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch channel stats & recent videos
        run: |
          python3 fetch_stats.py
          python3 fetch_videos.py

      - name: Commit & push stats.json & recent_videos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json recent_videos.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update YouTube stats & videos ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push "https://${GITHUB_TOKEN}@github.com/tedyoo82/poketsunny.git" HEAD:main
          fi
