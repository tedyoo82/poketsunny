name: Update YouTube Stats

# 매일 09:00 UTC (한국 18:00) + push 시 실행
on:
  schedule:
    - cron: "0 9 * * *"
  push:
    branches: [main]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch channel stats
        run: python3 fetch_stats.py

      - name: Commit & push stats.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "No changes to stats.json"
          else
            git commit -m "chore: update YouTube stats ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
